id: business_contact
title: 'Business Contact'
description: 'Business contact webform.'
categories: {  }
elements: |-
  name:
    '#type': webform_name
    '#title': Name
    '#title_display': ''
    '#required': true
    '#wrapper_type': container
    '#wrapper_attributes':
      class:
        - d-flex
    '#title__access': false
    '#first__title': 'First Name'
    '#first__placeholder': 'Enter your first name'
    '#first__title_display': before
    '#first__required': true
    '#middle__access': false
    '#last__title': 'Last name'
    '#last__placeholder': 'Enter your last name'
    '#last__title_display': before
    '#last__required': true
    '#suffix__access': false
    '#degree__access': false
    '#flexbox': '1'
  business:
    '#type': textfield
    '#title': 'Company name'
    '#title_display': before
    '#required': true
    '#placeholder': 'Enter Your Company Name'
  industry:
    '#type': select
    '#title': Industry
    '#title_display': before
    '#required': true
    '#empty_option': 'Select Industry'
    '#options':
      technology: Technology
      finance: 'Finance & Banking'
      healthcare: Healthcare
      education: Education
      retail: 'Retail & E-commerce'
      manufacturing: Manufacturing
      government: Government
      nonprofit: Nonprofit
      media: 'Media & Entertainment'
      other: Other
  country:
    '#type': select
    '#title': Country
    '#title_display': before
    '#required': true
    '#empty_option': 'Select Country'
    '#options': country_names
  email:
    '#type': email
    '#title': Email
    '#placeholder': 'Enter your business email address'
    '#required': true
  phone:
    '#type': tel
    '#title': 'Phone number'
    '#title_display': before
    '#international': true
    '#international_initial_country': us
    '#required': true
    '#placeholder': '000 000-0000'
    '#wrapper_attributes':
      class:
        - d-grid
    '#label_attributes':
      class:
        - d-block
    '#attributes':
      class:
        - w-100
  subject:
    '#type': textfield
    '#title': Subject
    '#title_display': before
    '#required': true
    '#placeholder': 'Type what would you like to discuss...'
  message:
    '#type': textarea
    '#title': Message
    '#placeholder': 'Enter inquiry details here...'
    '#counter_type': character
    '#counter_maximum': 200
    '#counter_minimum_message': '%d/200 Characters'
    '#wrapper_attributes':
      class:
        - text-end
    '#title_display': before
    '#label_attributes':
      class:
        - d-block
        - text-start
    '#attributes':
      class:
        - text-start
      data-options: '{"countDown": false}'
  agreement:
    '#type': checkbox
    '#title': 'By submitting this form you agree to our <a href="/terms-and-conditions">Terms of Service</a> and <a href="/privacy-policy">Privacy Policy</a>.'
    '#default_value': true
    '#disabled': true
    '#wrapper_attributes':
      class:
        - my-4
    '#label_attributes':
      class:
        - ms-2
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
    '#submit__label': 'Submit Form'
    '#submit__attributes':
      class:
        - btn-md
        - rounded-1
        - w-100
